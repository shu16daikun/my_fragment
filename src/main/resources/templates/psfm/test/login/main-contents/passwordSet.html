<!DOCTYPE html>
<html lang="ja"
	xmlns:th="http://www.thymeleaf.org">
	<!-- head要素ここから -->
	<head th:replace="~{test/login/common :: login-header('パスワード設定画面', ~{::extraHead})}">
		<!-- ページ固有の情報をheaderに追加 -->
		<th:block th:fragment="extraHead">
			<!-- 自作個別css -->
			<link rel="stylesheet" media="all" th:href="@{/css/main-contents/login/passwordSet.css}">
			<link rel="stylesheet" media="all" th:href="@{/css/fragment/signin.css}">
			<link rel="stylesheet" media="all" th:href="@{/css/fragment/body.css}">
			<link rel="stylesheet" media="all" th:href="@{/css/fragment/buttons.css}">
			<link rel="stylesheet" media="all" th:href="@{/css/fragment/form.css}">
			<link rel="stylesheet" media="all" th:href="@{/css/fragment/validation.css}">
			<link rel="stylesheet" media="all" th:href="@{/css/fragment/alert.css}">
			<!-- 自作個別js -->
			<script type="module" th:src="@{/js/main-contents/login/passwordSet.js}"></script>
		</th:block>
	</head>
	<!-- head要素ここまで -->
	<!-- body要素ここから -->
	<body class="my-items-center-body">
		<div th:replace="~{fragment/svg/icons :: svg-icons}"></div>
		<main class="my-form-signin">
			<form class="my-validation-input-change">
				<div class="my-alert-danger" data-text="エラーが発生しました。"></div>
				<div class="my-form-message">「th:ユーザー名」さん<br>新しいパスワードを設定してください。</div>
				<div class="my-validation-container">
					<div class="my-form-input" data-text="パスワード">
					    <input type="password" minlength="8" required>
					</div>
					<div class="my-invalid">パスワードを指定の形で設定してください</div>
				</div>
				<div class="my-validation-container">
					<div class="my-form-input" data-text="パスワード確認用">
					    <input type="password" minlength="8" required>
					</div>
					<div class="my-invalid">パスワード確認用を指定の形で設定してください</div>
				</div>
				<div class="btn-area">
					<button class="my-btn-primary" type="submit">パスワード設定</button>
					<a class="my-btn-secondary">キャンセル</a>
				</div>
			</form>
		</main>
		<!-- body要素ここまで -->
	</body>
</html>
