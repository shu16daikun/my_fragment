<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<!-- [header] START -->
	<!-- [fragment: common::test-header] START — 画面共通ヘッダ。第1引数=ページタイトル('Alert')、第2引数=このページ固有の追記領域 -->
	<head th:replace="~{psfm/fragment/common :: test-header('Alert', ~{::extraHead})}">
		<!-- [fragment-slot: extraHead] START — 当ページ固有のCSS/JSを head に差し込む -->
		<th:block th:fragment="extraHead">
			<!-- 自作個別css -->
			<link rel="stylesheet" media="all" th:href="@{/psfm/css/fragment/alert.css}">
			<!-- 自作個別js -->
			<script type="module" th:src="@{/psfm/js/main-contents/test/alert.js}"></script>
		</th:block>
		<!-- [fragment-slot: extraHead] END -->
	</head>
	<!-- [fragment: common::test-header] END -->
	<!-- [header] END -->

	<!-- [body] START -->
	<body>
		<!-- [fragment: svg-icons] START — 共通SVGスプライト -->
		<div th:replace="~{psfm/fragment/svg/icons :: svg-icons}"></div>
		<!-- [fragment: svg-icons] END -->

		<!-- [main] START -->
		<!-- [section: demo-alerts] START — デモ用各種アラート（data-textをJSで描画） -->
		<!-- “画面に見せるもの”：レンダリング後のテキスト / “ログ専用”：なし -->
		<div class="my-alert-success"  data-text="保存に成功しました"></div>
		<div class="my-alert-primary"  data-text="今日の情報"></div>
		<div class="my-alert-danger"   data-text="エラーが発生しました。"></div>
		<div class="my-alert-warning"  data-text="現在では保存が完了していません"></div>
		<!-- [section: demo-alerts] END -->
		<!-- [main] END -->

	</body>
	<!-- [body] END -->
</html>
